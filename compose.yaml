services:
  threadglass:
    build: .
    ports:
      - '127.0.0.1:3001:3001'
    init: true
    restart: unless-stopped
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - seccomp=./docker/seccomp_profile.json
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DIAGNOSTICS: 'false'
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/artifacts:size=64m,uid=1001,gid=1001,mode=0700
